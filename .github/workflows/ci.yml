name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install stable Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Lint
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Build documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --all-features --no-deps

      - name: Test
        run: cargo test --all-targets --all-features

      # The demo binaries are otherwise only compiled; these run without a node.
      - name: Run the offline examples
        run: |
          cargo run --all-features --example getting_started
          cargo run --all-features --example counter
          for script in examples/vault/scripts/*.txt; do
            cargo run --all-features --example vault -- --local --script "$script"
          done

  # The #[ignore]d end-to-end tests, against a MATT-enabled regtest node.
  regtest:
    runs-on: ubuntu-24.04
    container: bigspider/bitcoin_matt
    steps:
      - name: Install build tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl git build-essential

      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install stable Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: End-to-end tests on regtest
        run: scripts/regtest-tests.sh
